<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
        }
        button {
            background: #00bcd4;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0097a7;
        }
        input, textarea {
            padding: 0.4rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        hr {
            border: none;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <script type="module">
        import init, { hydrate } from './pkg/blog_wasm.js';
        async function run() {
            await init();
            hydrate();
            console.log("WASM loaded and hydrated");
        }

        run().catch(console.error);
    </script>
</body>
</html>
