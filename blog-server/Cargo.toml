[package]
name = "blog-server"
version = "0.1.0"
edition = "2024"

[dependencies]
blog-proto = { workspace = true }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
actix-web = "4.14"
actix-web-httpauth = "0.8"
actix-cors = "0.7"
tonic = { workspace = true }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "migrate", "tls-native-tls", "chrono"] }
dotenvy = "0.15"
jsonwebtoken = { version = "11.0", features = ["rust_crypto"]}
argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = [ "serde" ] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter", "fmt" ] }
