[workspace]

members = [
    "blog-proto",
    "blog-server",
    "blog-client",
    "blog-cli",
    "blog-wasm",
]
resolver = "3"

[workspace.dependencies]
blog-proto = { path = "blog-proto" }
blog-client = { path = "blog-client" }

tokio = "1.53"
tonic = "0.14"
serde = "1.0"
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
pbjson-types = "0.9"
